<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Agent Graph Designer</title>
    <script type="module" crossorigin src="/adk_aiagent_graph/assets/index-Bg3aHBMW.js"></script>
    <link rel="stylesheet" crossorigin href="/adk_aiagent_graph/assets/index-oiiX1N6M.css">
  </head>
  <body>
    <div id="root">
      <div id="boot-status" style="padding:20px;font-family:system-ui,sans-serif;color:#172033">
        Agent Graph Designer を起動しています…
      </div>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var el = document.getElementById('boot-status');
        if (el) {
          el.textContent = '起動エラー: ' + (event.message || 'JavaScriptの読み込みに失敗しました');
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        var el = document.getElementById('boot-status');
        if (el) {
          el.textContent = '起動エラー: ' + String(event.reason || 'Promise error');
        }
      });
    </script>
  </body>
</html>
