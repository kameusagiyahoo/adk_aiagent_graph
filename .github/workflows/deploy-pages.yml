name: Build Pages files

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Clean generated Pages files
        run: rm -rf docs/assets docs/index.html
      - run: npm run build
      - name: Commit built site to docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No Pages build changes"
            exit 0
          fi
          git commit -m "build: update GitHub Pages files [skip ci]"
          git push
